services:
  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: ghcr.io/tobysuch/tokenbury:latest
    env_file: .env
    volumes:
      - media:/app/media
      - frontend_dist:/srv
    depends_on:
      - db
    restart: unless-stopped

  ticker:
    image: ghcr.io/tobysuch/tokenbury:latest
    env_file: .env
    entrypoint: ./ticker_entrypoint.sh
    depends_on:
      - db
    restart: unless-stopped
    profiles:
      - ticker

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  media:
  caddy_data:
  caddy_config:
  frontend_dist:
